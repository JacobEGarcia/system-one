<style>
:root{

}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{
  font-family:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,176,0,.012) 3px 4px);
}
a{color:var(--amber)}
.top{border-bottom:1px solid var(--line);padding:18px 22px;display:flex;flex-wrap:wrap;gap:8px 26px;align-items:baseline}
h1{font-size:22px;letter-spacing:6px;color:var(--amber);font-weight:600}
h1 .sys{color:var(--red)}
.sub{font-size:11px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.badge{border:1px solid var(--amber-dim);color:var(--amber);font-size:10px;letter-spacing:1px;padding:3px 8px;text-transform:uppercase}
.layout{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 70px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.side{border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 70px)}
@media(max-width:900px){.side{max-height:none;border-right:none;border-bottom:1px solid var(--line)}}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:14px 14px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.cat{font-size:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line);color:var(--muted);background:none;padding:5px 9px;cursor:pointer;font-family:inherit}
.cat:hover{border-color:var(--amber-dim);color:var(--text)}
.cat.on{border-color:var(--amber);color:var(--amber);background:rgba(255,176,0,.07)}
.search{width:calc(100% - 28px);margin:10px 14px;background:var(--panel);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:12px;padding:8px 10px}
.search:focus{outline:1px solid var(--amber-dim)}
.item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line);color:var(--text);font-family:inherit;padding:12px 14px;cursor:pointer;font-size:12px;line-height:1.45}
.item:hover{background:rgba(255,176,0,.05)}
.item.on{background:rgba(255,176,0,.09);border-left:3px solid var(--amber);padding-left:11px}
.item .q{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px}
.main{padding:26px 30px 60px;max-width:980px}
.state{border:1px solid var(--line);background:var(--panel);padding:18px 20px;font-size:14px;line-height:1.7}
.state::before{content:"STATE //";color:var(--red);font-size:10px;letter-spacing:2px;display:block;margin-bottom:10px}
.qblock{margin-top:26px}
.qlabel{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.qtext{font-size:16px;color:var(--amber);margin-bottom:14px}
.opt{margin:10px 0;cursor:default}
.opt-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:12px}
.opt-name{overflow-wrap:anywhere}
.opt-pct{color:var(--muted);white-space:nowrap}
.bar{height:14px;border:1px solid var(--line);position:relative;background:var(--panel)}
.fill{position:absolute;inset:1px auto 1px 1px;background:var(--amber-faint);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.picked .fill{background:var(--amber)}
.picked .opt-name{color:var(--amber)}
.picked .opt-pct{color:var(--amber)}
.pick-tag{font-size:9px;letter-spacing:1.5px;color:var(--bg);background:var(--amber);padding:1px 5px;margin-left:8px;text-transform:uppercase;vertical-align:2px}
.conf{margin-top:8px;font-size:11px;color:var(--muted);letter-spacing:1px}
.conf b{color:var(--green);font-weight:600}
.foot{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:11px;color:var(--muted);line-height:1.9}
.warn{color:var(--red)}
.count{font-size:10px;color:var(--muted);letter-spacing:1px;padding:0 14px 12px}
.kbd{border:1px solid var(--line);padding:0 4px;font-size:10px;color:var(--muted)}
</style>
</head>

const $ = s=>document.querySelector(s);
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function catLabel(c){return c==='luckycat'?'lucky cat':c}
function renderCats(){
  $('#cats').innerHTML = ['all',...CATS].map(c=>
    `<button class="cat${c===cat?' on':''}" data-c="${c}">${catLabel(c)}</button>`).join('');
  document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.dataset.c;idx=0;render()});
}
function filtered(){
  return DATA.filter(d=>(cat==='all'||d.cat===cat) &&
    (!q || (d.state+' '+d.answers.map(a=>a.question+' '+a.options.join(' ')).join(' ')).toLowerCase().includes(q)));
}
function renderList(){
  const f=filtered();
  $('#count').textContent = f.length+' decisions';
  $('#list').innerHTML = f.map((d,i)=>{
    const q1=d.answers[0];
    return `<button class="item${i===idx?' on':''}" data-i="${i}">
      <span class="q">${catLabel(d.cat)} // ${esc(q1.question)}</span>${esc(d.state.length>110?d.state.slice(0,110)+'…':d.state)}
    </button>`}).join('') || '<div class="count">no matches</div>';
  document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render()});
}
function renderMain(){
  const f=filtered(); if(!f.length){$('#main').innerHTML='';return}
  const d=f[Math.min(idx,f.length-1)];
  let h=`<div class="state">${esc(d.state)}</div>`;
  d.answers.forEach((a,ai)=>{
    const max=Math.max(...a.probs);
    h+=`<div class="qblock"><div class="qlabel">question ${ai+1} / ${d.answers.length}</div>
      <div class="qtext">${esc(a.question)}</div>`;
    a.options.forEach((o,oi)=>{
      const p=a.probs[oi], pick=o===a.choice;
      h+=`<div class="opt${pick?' picked':''}">
        <div class="opt-top"><span class="opt-name">(${String.fromCharCode(65+oi)}) ${esc(o)}${pick?'<span class="pick-tag">model pick</span>':''}</span>
        <span class="opt-pct">${(p*100).toFixed(1)}%</span></div>
        <div class="bar"><div class="fill" data-w="${(p*100).toFixed(1)}"></div></div></div>`;
    });
    h+=`<div class="conf">top answer <b>${esc(a.choice)}</b> at <b>${(a.confidence*100).toFixed(1)}%</b> calibrated probability &middot; ${a.options.length} options scored in a single forward pass</div></div>`;
  });
  h+=`<div class="foot">
    MODEL <a href="https://huggingface.co/Mapika/decider-4b">Mapika/decider-4b</a> revision <b>v2</b> (the exact JevBench v1.4.2 #1) &middot; 4B dense, Qwen3.5-4B base &middot; Apache-2.0<br>
    Every probability on this page is a real model output, computed once on a free Kaggle GPU (${META.generated_utc}). Serving temperatures: choice ${META.temperatures.choice}, yes/no ${META.temperatures.noul}.<br>
    <span class="warn">HONEST NOTE:</span> this is a console of real precomputed outputs, not a live API. The model decides between options you give it &mdash; it does not generate text. Health entries are a triage judgment demo, not medical advice.<br>
    Source: <a href="https://x.com/bluecow009/status/2103326124835311700">the X post</a> &middot; <a href="https://benchmarkheaven.com/jev-models">JevBench</a> &middot; <span class="kbd">&uarr;</span><span class="kbd">&darr;</span> to browse
  </div>`;
  $('#main').innerHTML=h;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%');
  }));
}
function render(){renderCats();renderList();renderMain()}
$('#search').oninput=e=>{q=e.target.value.toLowerCase();idx=0;renderList();renderMain()};
document.addEventListener('keydown',e=>{
  const f=filtered();
  if(e.key==='ArrowDown'){idx=Math.min(idx+1,f.length-1);renderList();renderMain();e.preventDefault()}
  if(e.key==='ArrowUp'){idx=Math.max(idx-1,0);renderList();renderMain();e.preventDefault()}
});
render();
</script>
</body>
</html>
